name: Release SFTP

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact stable SemVer version to publish (X.Y.Z)'
        required: true
        default: '2.0.0'
        type: string
      channel:
        description: 'npm dist-tag'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest

      - name: Resolve idempotent release state
        id: state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node scripts/release.mjs prepare "$RELEASE_VERSION" "$RELEASE_CHANNEL"
          git fetch origin main --tags
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            git reset --hard
            git checkout --detach "${tag}"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare manifest and exact release notes
        if: steps.state.outputs.existing != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release.mjs prepare "$RELEASE_VERSION" "$RELEASE_CHANNEL"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: unused
        run: yarn install --frozen-lockfile

      - name: Run complete release validation
        env:
          NODE_AUTH_TOKEN: unused
        run: |
          yarn lint:ci
          yarn typecheck
          yarn test:coverage
          yarn build
          yarn changelog:check
          yarn test:scripts
          yarn package:check

      - name: Commit synchronized release state
        if: steps.state.outputs.existing != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md changelog/
          git commit --allow-empty -m "chore(release): ${RELEASE_VERSION}"

      - name: Rebase when main advanced concurrently
        if: steps.state.outputs.existing != 'true'
        id: rebase
        env:
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            git rebase origin/main
            echo "revalidated=true" >> "$GITHUB_OUTPUT"
          else
            echo "revalidated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Revalidate after concurrent main advancement
        if: steps.rebase.outputs.revalidated == 'true'
        env:
          NODE_AUTH_TOKEN: unused
        run: |
          yarn install --frozen-lockfile
          yarn lint:ci
          yarn typecheck
          yarn test:coverage
          yarn build
          yarn changelog:check
          yarn test:scripts
          yarn package:check

      - name: Push release commit and immutable tag
        if: steps.state.outputs.existing != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          git push origin HEAD:main
          tag="v${RELEASE_VERSION}"
          git tag -a "$tag" -m "Factorydrive SFTP ${RELEASE_VERSION}"
          git push origin "$tag"

      - name: Verify release tag and rebuild audited tarball
        id: release
        env:
          NODE_AUTH_TOKEN: unused
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          git fetch origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
          release_sha="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
          test "$release_sha" = "$(git rev-parse HEAD)"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          yarn package:check

      - name: Publish if missing and verify registry bytes
        env:
          # Bootstrap 2.0.0 only. Configure this as a one-day secret in the
          # protected npm environment, then remove it after Trusted Publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          wait_for_version() {
            local package_spec="$1"
            local expected_version="$2"
            local published_version=""
            for attempt in $(seq 1 60); do
              published_version="$(npm view "$package_spec" version 2>/dev/null || true)"
              if [ "$published_version" = "$expected_version" ]; then
                return 0
              fi
              [ "$attempt" -eq 60 ] || sleep 10
            done
            echo "npm registry did not expose ${package_spec} as ${expected_version} in time" >&2
            return 1
          }
          pack_from_registry() {
            local package_spec="$1"
            local packed_json=""
            for attempt in $(seq 1 60); do
              if packed_json="$(npm pack "$package_spec" --json --ignore-scripts --pack-destination .artifacts/registry 2>/dev/null)"; then
                printf '%s' "$packed_json"
                return 0
              fi
              [ "$attempt" -eq 60 ] || sleep 10
            done
            echo "npm registry did not expose the tarball for ${package_spec} in time" >&2
            return 1
          }
          tarball=".artifacts/npm/ficsysfr-nestjs_module_factorydrive-sftp-${RELEASE_VERSION}.tgz"
          if npm view "@ficsysfr/nestjs_module_factorydrive-sftp@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "@ficsysfr/nestjs_module_factorydrive-sftp@${RELEASE_VERSION} already exists; verifying it"
          else
            npm publish "$tarball" --access public --provenance --tag "$RELEASE_CHANNEL"
          fi
          wait_for_version "@ficsysfr/nestjs_module_factorydrive-sftp@${RELEASE_CHANNEL}" "$RELEASE_VERSION"
          mkdir -p .artifacts/registry
          packed_json="$(pack_from_registry "@ficsysfr/nestjs_module_factorydrive-sftp@${RELEASE_VERSION}")"
          packed_file="$(node -e 'const input=JSON.parse(process.argv[1]); const reports=Array.isArray(input)?input:input?.filename?[input]:Object.values(input??{}); if (reports.length!==1 || !reports[0]?.filename) process.exit(1); process.stdout.write(reports[0].filename)' "$packed_json")"
          local_sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
          registry_sha="$(sha256sum ".artifacts/registry/${packed_file}" | cut -d' ' -f1)"
          test "$local_sha" = "$registry_sha"

      - name: Upload audited release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ inputs.release_version }}
          path: |
            .artifacts/npm/
            .artifacts/release/${{ inputs.release_version }}.md
          if-no-files-found: error

      - name: Create or update the exact GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          tag="v${RELEASE_VERSION}"
          notes=".artifacts/release/${RELEASE_VERSION}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$RELEASE_VERSION" --notes-file "$notes"
          else
            gh release create "$tag" --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_VERSION" --notes-file "$notes"
          fi
          gh release upload "$tag" .artifacts/npm/*.tgz .artifacts/npm/SHA256SUMS.txt --clobber
